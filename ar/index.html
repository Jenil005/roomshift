<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RoomShift AR Room</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05070a; color: #dfe9f3; font-family: system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(5,7,10,.88); z-index: 5; padding: 24px; text-align: center; }
    .overlay h1 { margin: 0; font-size: 22px; letter-spacing: .08em; color: #ffb020; }
    .overlay p { margin: 0; opacity: .75; max-width: 320px; font-size: 14px; }
    button, input { font: inherit; border-radius: 10px; border: 1px solid #2c3b4c; background: #101822; color: #dfe9f3; padding: 12px 18px; }
    button { cursor: pointer; } button.primary { background: #ffb020; color: #1a1200; border-color: #ffb020; font-weight: 700; }
    input { text-transform: uppercase; text-align: center; width: 120px; letter-spacing: .2em; }
    #hud { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; display: none; justify-content: space-between; align-items: center; gap: 8px; padding: 10px; z-index: 3; pointer-events: none; font-size: 13px; }
    #hud > * { pointer-events: auto; } #hud .pill { background: rgba(5,7,10,.65); border: 1px solid #2c3b4c; border-radius: 999px; padding: 6px 12px; }
    #hud button { padding: 6px 12px; font-size: 13px; }
    #toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0) + 28px); left: 50%; transform: translateX(-50%); background: rgba(5,7,10,.8); border: 1px solid #ffb020; border-radius: 12px; padding: 10px 16px; z-index: 4; opacity: 0; transition: opacity .25s; pointer-events: none; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <span class="pill" id="roomPill"></span>
    <span class="pill" id="peerPill">1 player</span>
    <span style="display:flex; gap:6px">
      <button id="motionBtn">Motion</button>
      <button id="recenterBtn">Recenter</button>
      <button id="resetBtn" style="display:none">Reset</button>
    </span>
  </div>
  <div id="toast"></div>
  <div class="overlay" id="landing">
    <h1>BLACKOUT PROTOCOL</h1>
    <p>Shared AR room. One device hosts, the other joins with the room code.</p>
    <button class="primary" id="hostBtn">Host a room</button>
    <div style="display:flex; gap:8px"><input id="codeInput" maxlength="4" placeholder="CODE" /><button id="joinBtn">Join</button></div>
  </div>
  <script type="module" src="./demo/main.ts"></script>
</body>
</html>
